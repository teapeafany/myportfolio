<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cinema - Tiffany Lee</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cinema.css">
</head>
<body class="cinema-state-cover">
    <script src="js/paper-ink-filter.js"></script>
    <script src="js/nav-scroll.js" defer></script>
    <div id="navigation-container"></div>

    <!-- Cover: all films preview (short muted loops) -->
    <section class="cinema-cover" id="cinema-cover" aria-label="Film reel preview">
        <div class="cinema-subtitle-wrap" id="cinema-subtitles">
            <p class="cinema-subtitle-tagline">settle in, pick a piece, and get cozy! the showing has begun.</p>
        </div>
        <div class="cinema-cover__grid" role="list">
            <button type="button" class="cinema-cover__cell" data-film-index="0" role="listitem" aria-label="Open drift in theater">
                <span class="cinema-cover__cell-inner">
                    <div class="cinema-cover__player" id="cover-yt-0"></div>
                    <span class="cinema-cover__shine" aria-hidden="true"></span>
                    <span class="cinema-cover__dim" aria-hidden="true"></span>
                    <span class="cinema-cover__film-title">drift</span>
                </span>
                <span class="cinema-cover__cell-focus" aria-hidden="true"></span>
            </button>
            <button type="button" class="cinema-cover__cell" data-film-index="1" role="listitem" aria-label="Open me in theater">
                <span class="cinema-cover__cell-inner">
                    <div class="cinema-cover__player" id="cover-yt-1"></div>
                    <span class="cinema-cover__shine" aria-hidden="true"></span>
                    <span class="cinema-cover__dim" aria-hidden="true"></span>
                    <span class="cinema-cover__film-title">me</span>
                </span>
                <span class="cinema-cover__cell-focus" aria-hidden="true"></span>
            </button>
            <button type="button" class="cinema-cover__cell" data-film-index="2" role="listitem" aria-label="Open a letter in theater">
                <span class="cinema-cover__cell-inner">
                    <div class="cinema-cover__player" id="cover-yt-2"></div>
                    <span class="cinema-cover__shine" aria-hidden="true"></span>
                    <span class="cinema-cover__dim" aria-hidden="true"></span>
                    <span class="cinema-cover__film-title">a letter</span>
                </span>
                <span class="cinema-cover__cell-focus" aria-hidden="true"></span>
            </button>
            <button type="button" class="cinema-cover__cell" data-film-index="3" role="listitem" aria-label="Open a summer in berlin in theater">
                <span class="cinema-cover__cell-inner">
                    <div class="cinema-cover__player" id="cover-yt-3"></div>
                    <span class="cinema-cover__shine" aria-hidden="true"></span>
                    <span class="cinema-cover__dim" aria-hidden="true"></span>
                    <span class="cinema-cover__film-title">a summer in berlin</span>
                </span>
                <span class="cinema-cover__cell-focus" aria-hidden="true"></span>
            </button>
        </div>
    </section>

    <!-- Full theater experience -->
    <div class="cinema-theater" id="cinema-theater" aria-hidden="true">
        <main class="cinema-container">
            <div class="video-container">
                <iframe
                    id="video-iframe"
                    width="800"
                    height="450"
                    src="https://www.youtube.com/embed/7XPD9Hph7YE?start=3&autoplay=0&mute=0&controls=1&rel=0"
                    title="Tiffany Lee - Film Portfolio"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>
        </main>
    </div>

    <div class="cinema-curtain" id="cinema-curtain" aria-hidden="true"></div>

    <script>
        function includeNavigation() {
            const navHTML = `
                <nav class="nav-menu">
                    <a href="index.html" class="nav-item" id="nav-home">home</a>
                    <a href="work.html" class="nav-item" id="nav-design">work</a>
                    <a href="headspace.html" class="nav-item" id="nav-headspace">headspace</a>
                    <a href="cinema.html" class="nav-item" id="nav-cinema">the cinema</a>
                </nav>
            `;
            document.getElementById('navigation-container').innerHTML = navHTML;
            document.getElementById('nav-cinema').classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', includeNavigation);
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                document.body.classList.add('loaded');
            }, 100);
        });

        (function () {
            const CINEMA_FILMS = [
                { id: '7XPD9Hph7YE', theaterStart: 3, clip: [3, 9] },
                { id: 'kSA3ce_mrag', theaterStart: 0, clip: [0, 7] },
                { id: 'KknuJHiBBr8', theaterStart: 0, clip: [0, 7] },
                { id: 'okb1mJCpJkc', theaterStart: 0, clip: [0, 7] }
            ];

            function theaterEmbedUrl(index) {
                const f = CINEMA_FILMS[index];
                const start = f.theaterStart > 0 ? '&start=' + f.theaterStart : '';
                return 'https://www.youtube.com/embed/' + f.id + '?autoplay=1&mute=0&controls=1&rel=0' + start;
            }

            function theaterEmbedUrlNoAutoplay(index) {
                const f = CINEMA_FILMS[index];
                const start = f.theaterStart > 0 ? '&start=' + f.theaterStart : '';
                return 'https://www.youtube.com/embed/' + f.id + '?autoplay=0&mute=0&controls=1&rel=0' + start;
            }

            let currentVideo = 1;
            const cover = document.getElementById('cinema-cover');
            const theater = document.getElementById('cinema-theater');
            const curtain = document.getElementById('cinema-curtain');
            const videoIframe = document.getElementById('video-iframe');
            const coverCells = document.querySelectorAll('.cinema-cover__cell');

            const coverPlayers = [];
            let coverClipIntervals = [];
            let coverGridInited = false;

            function clearCoverClipWatchers() {
                coverClipIntervals.forEach(function (id) {
                    clearInterval(id);
                });
                coverClipIntervals = [];
            }

            function attachClipLoop(player, clipStart, clipEnd) {
                const interval = setInterval(function () {
                    try {
                        if (player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
                            const t = player.getCurrentTime();
                            if (t >= clipEnd - 0.05) {
                                player.seekTo(clipStart, true);
                            }
                        }
                    } catch (e) { /* ignore */ }
                }, 120);
                coverClipIntervals.push(interval);
            }

            function pauseAllCoverPlayers() {
                coverPlayers.forEach(function (p) {
                    try {
                        if (p && p.pauseVideo) p.pauseVideo();
                    } catch (e) { /* ignore */ }
                });
            }

            function initCoverPlayers() {
                if (coverGridInited) return;
                coverGridInited = true;
                CINEMA_FILMS.forEach(function (film, i) {
                    const clipStart = film.clip[0];
                    const clipEnd = film.clip[1];
                    const p = new YT.Player('cover-yt-' + i, {
                        videoId: film.id,
                        width: '100%',
                        height: '100%',
                        playerVars: {
                            autoplay: 1,
                            mute: 1,
                            controls: 0,
                            modestbranding: 1,
                            playsinline: 1,
                            rel: 0,
                            disablekb: 1,
                            fs: 0,
                            start: clipStart
                        },
                        events: {
                            onReady: function (e) {
                                e.target.mute();
                                e.target.seekTo(clipStart, true);
                                e.target.playVideo();
                                attachClipLoop(e.target, clipStart, clipEnd);
                            }
                        }
                    });
                    coverPlayers[i] = p;
                });
            }

            window.onYouTubeIframeAPIReady = function () {
                initCoverPlayers();
            };

            if (window.YT && window.YT.Player) {
                initCoverPlayers();
            } else {
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.async = true;
                document.head.appendChild(tag);
            }

            function setTheaterMode(on) {
                document.body.classList.toggle('cinema-state-theater', on);
                document.body.classList.toggle('cinema-state-cover', !on);
                theater.setAttribute('aria-hidden', on ? 'false' : 'true');
                cover.setAttribute('aria-hidden', on ? 'true' : 'false');
            }

            function runCurtain(ms, callback) {
                curtain.setAttribute('aria-hidden', 'false');
                curtain.classList.add('cinema-curtain--visible');
                setTimeout(function () {
                    callback();
                    requestAnimationFrame(function () {
                        curtain.classList.remove('cinema-curtain--visible');
                        curtain.setAttribute('aria-hidden', 'true');
                    });
                }, ms);
            }

            function enterTheaterFromCover(filmIndex) {
                const cell = document.querySelector('.cinema-cover__cell[data-film-index="' + filmIndex + '"]');
                coverCells.forEach(function (c) {
                    c.classList.remove('cinema-cover__cell--selected');
                });
                if (cell) cell.classList.add('cinema-cover__cell--selected');
                cover.classList.add('cinema-cover--exiting');
                document.body.classList.add('cinema-transitioning');

                setTimeout(function () {
                    runCurtain(520, function () {
                        pauseAllCoverPlayers();
                        clearCoverClipWatchers();
                        currentVideo = filmIndex + 1;
                        videoIframe.src = theaterEmbedUrl(filmIndex);
                        cover.classList.remove('cinema-cover--exiting');
                        cover.classList.add('cinema-cover--hidden');
                        setTheaterMode(true);
                        document.body.classList.remove('cinema-transitioning');
                        history.pushState({ cinemaTheater: true }, '', window.location.href);
                    });
                }, 380);
            }

            function returnToCover() {
                if (!document.body.classList.contains('cinema-state-theater')) return;
                document.body.classList.add('cinema-transitioning');
                runCurtain(480, function () {
                    videoIframe.src = theaterEmbedUrlNoAutoplay(currentVideo - 1);
                    document.body.classList.remove('video-playing');
                    setTheaterMode(false);
                    cover.classList.remove('cinema-cover--hidden');
                    clearCoverClipWatchers();
                    CINEMA_FILMS.forEach(function (film, i) {
                        const p = coverPlayers[i];
                        if (!p || !p.seekTo) return;
                        try {
                            p.seekTo(film.clip[0], true);
                            attachClipLoop(p, film.clip[0], film.clip[1]);
                            p.mute();
                            p.playVideo();
                        } catch (e) { /* ignore */ }
                    });
                    coverCells.forEach(function (c) {
                        c.classList.remove('cinema-cover__cell--selected');
                    });
                    document.body.classList.remove('cinema-transitioning');
                });
            }

            coverCells.forEach(function (cell) {
                cell.addEventListener('click', function () {
                    const idx = parseInt(cell.getAttribute('data-film-index'), 10);
                    if (isNaN(idx)) return;
                    enterTheaterFromCover(idx);
                });
            });

            window.addEventListener('popstate', function (e) {
                var toTheater = e.state && e.state.cinemaTheater;
                var inTheater = document.body.classList.contains('cinema-state-theater');
                if (toTheater && !inTheater) {
                    cover.classList.remove('cinema-cover--exiting');
                    cover.classList.add('cinema-cover--hidden');
                    pauseAllCoverPlayers();
                    clearCoverClipWatchers();
                    videoIframe.src = theaterEmbedUrl(currentVideo - 1);
                    setTheaterMode(true);
                    return;
                }
                if (!toTheater && inTheater) {
                    returnToCover();
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape') return;
                if (!document.body.classList.contains('cinema-state-theater')) return;
                e.preventDefault();
                history.back();
            });

            theater.addEventListener('click', function (e) {
                if (!document.body.classList.contains('cinema-state-theater')) return;
                if (e.target.closest('.video-container')) return;
                history.back();
            });

            function handleVideoStateChange() {
                const checkVideoState = function () {
                    if (document.activeElement === videoIframe) {
                        document.body.classList.add('video-playing');
                    }
                };
                setInterval(checkVideoState, 2000);
                videoIframe.addEventListener('click', function () {
                    document.body.classList.add('video-playing');
                });
                window.addEventListener('focus', function () {
                    if (document.activeElement === videoIframe) {
                        document.body.classList.add('video-playing');
                    }
                });
                window.addEventListener('blur', function () {
                    document.body.classList.remove('video-playing');
                });
                document.addEventListener('click', function (e) {
                    const vc = videoIframe.closest('.video-container');
                    if (vc && !vc.contains(e.target) && document.body.classList.contains('cinema-state-theater')) {
                        /* leave dimming to user focus on iframe */
                    }
                });
                videoIframe.addEventListener('blur', function () {
                    setTimeout(function () {
                        if (document.activeElement !== videoIframe) {
                            /* optional: could remove video-playing */
                        }
                    }, 1000);
                });
            }
            handleVideoStateChange();
        })();
    </script>
</body>
</html>
